<!doctype html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>VideoEsport · Cinematic film</title></head>
<body>
<main id="stage"><div id="film">
<div id="cam"><canvas id="world"></canvas></div>
<div id="shade"></div><div id="leak"></div><div id="vignette"></div><div id="grain"></div><div id="streak"></div>
<div id="logos" aria-label="Hội Sinh viên · Khoa · CLB Tin học"><img src="/assets/logos/hoi-sinh-vien.png" alt="Hội Sinh viên Việt Nam"><img src="/assets/logos/khoa.png" alt="Logo Khoa"><img src="/assets/logos/clb-tin-hoc.png" alt="Câu lạc bộ Tin học"></div>
<div id="copy"><div id="eyebrow"></div><h1 id="headline"></h1><p id="description"></p><div id="tags"></div></div>
<div id="words"></div>
<div id="bottom"><span id="brand"></span><span>ESPORTS <i>/</i> DEPARTMENT</span></div>
<div id="credit"></div><div id="progress"></div><div id="wipe"></div><div id="curtain"></div>
</div></main>
<nav id="controls"><button id="play">Phát</button><input id="scrub" aria-label="Vị trí video" type="range" min="0" max="84" step="0.01" value="0"><span id="time">00:00 / 01:24</span><button id="mute">Tắt tiếng</button><button id="fullscreen">Toàn màn hình</button></nav>
<aside id="notice">ACTION TRAILER · 84 GIÂY · NHẠC + HIỆU ỨNG ÂM THANH</aside><div id="error" role="alert"></div>
<script type="module" src="/src/main.js"></script></body></html>
